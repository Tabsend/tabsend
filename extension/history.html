<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="history.pageTitle"></title>
    <link rel="icon" href="icons/tabsend-32.png" />
    <link rel="icon" sizes="16x16" href="icons/tabsend-16.png" />
    <link rel="icon" sizes="48x48" href="icons/tabsend-48.png" />
    <link rel="stylesheet" href="/src/pages/ui.css" />
    <style>
      body {
        display: flex;
        justify-content: center;
        padding: 48px 16px 64px;
      }
      main { width: 100%; max-width: 600px; }
      .page-title { margin-bottom: 8px; }
      .desc { font-size: 14px; color: var(--muted); margin: 0 0 28px; }
      .desc:empty { margin-bottom: 20px; }

      /* One block per send: a flat white list card. A multi-tab send is one
         card with a heading; a single send is one card with no heading, so it
         reads as one tab and not as "1 tabs". */
      .group {
        border-radius: 14px;
        margin-bottom: 12px;
        background: var(--card);
        overflow: hidden;
      }
      /* A send that expired unacked is the one outcome this page exists to
         surface, so the whole block carries it, not just a word at the end of
         a row that truncates. Tint + a danger rule + the words. */
      .group.never-arrived {
        background: linear-gradient(var(--danger-tint), var(--danger-tint)), var(--card);
        box-shadow: inset 4px 0 0 var(--danger);
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 6px 10px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border-bottom: 1.5px solid var(--line);
      }
      .group-count { font-size: 15px; font-weight: 700; }
      .group-meta { font-size: 13px; color: var(--muted); flex: 1; }
      .open-all, .again {
        flex: none;
        border: var(--outline);
        background: var(--card);
        border-radius: 9px;
        padding: 5px 11px;
        font: 600 13px/1.2 var(--font);
        color: var(--ink);
        cursor: pointer;
      }
      .open-all:hover, .again:hover { background: var(--chip); }

      ul { list-style: none; margin: 0; padding: 0; }
      li + li { border-top: 1.5px solid var(--line); }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
      }
      /* The direction glyph, in a chip tile. Mail imagery, never a bare arrow:
         an arrow alone in a row's left gutter reads as a control for reordering
         the list, and says nothing about what it means [ADR-0028 §9]. */
      .dir {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex: none;
        border-radius: 10px;
        background: var(--chip);
        color: var(--ink);
      }
      .dir svg { width: 18px; height: 18px; display: block; }
      .tab {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        margin: -6px 0 -6px -6px;
        padding: 6px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        font: inherit;
        color: inherit;
        text-align: left;
        text-decoration: none;
      }
      button.tab { cursor: pointer; }
      button.tab:hover { background: var(--accent-tint); }
      .tab-text { min-width: 0; flex: 1; }
      .tab-title {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 15px;
        font-weight: 600;
      }
      /* A row we hold no key for is still a true record of a transfer, so it is
         quieter rather than absent. */
      .tab-title.unreadable { color: var(--muted); font-style: italic; font-weight: 400; }
      .tab-sub {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
        color: var(--muted);
      }
      .state {
        flex: none;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: var(--success);
        background: var(--success-tint);
        white-space: nowrap;
      }
      .state.waiting { color: var(--waiting); background: var(--waiting-tint); }
      .state.never-arrived { color: var(--danger); background: var(--danger-tint); }
      .again { color: var(--danger); border-color: var(--danger); }
      .again:hover { background: var(--danger-tint); }
      .again[disabled] { opacity: 0.6; cursor: default; }
      /* Under a row whose device has left the group: what happened, and where else
         it can go (PLANS P-31 item 4). Lined up with the row's text, past the glyph. */
      .again-gone { margin: -2px 16px 10px 70px; font-size: 13px; color: var(--muted); }
      .again-gone-choices { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; }
      .again-gone-choices .linkish { font-size: 13px; }
      .again-gone-choices select { min-height: 32px; padding: 4px 8px; font-size: 13px; }

      .section-heading { margin: 20px 4px 10px; font-size: 15px; font-weight: 700; }
      .section-heading:first-child { margin-top: 0; }
      .latest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .latest.single { grid-template-columns: minmax(0, 1fr); }
      .card-tab {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 14px;
        overflow: hidden;
        background: var(--card);
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .card-tab:hover { background: var(--accent-tint); }
      .card-text { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; min-width: 0; }
      .card-route { font-size: 12px; font-weight: 700; color: var(--muted); }
      .card-title {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }
      .picture {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        overflow: hidden;
        background: var(--chip);
        color: var(--muted);
        font-weight: 700;
      }
      .picture.thumb { width: 64px; height: 44px; border-radius: 8px; font-size: 17px; }
      .picture.cover { height: 132px; font-size: 34px; }
      .picture-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .picture-icon { width: 24px; height: 24px; border-radius: 4px; }
      @media (max-width: 480px) { .row { flex-wrap: wrap; } .tab { flex-basis: calc(100% - 54px); } .state, .again { margin-left: 48px; } .again-gone { margin-left: 64px; } }
      /* A one-time question, not part of the page: tinted, outlined and closable. */
      #pictures-ask {
        position: relative;
        display: flex;
        gap: 14px;
        border: 1.5px solid var(--accent);
        border-radius: 14px;
        padding: 16px 44px 16px 16px;
        margin-bottom: 24px;
        background: var(--accent-tint);
        font-size: 14px;
        line-height: 1.5;
      }
      #pictures-ask.hidden { display: none; }
      .pictures-ask-glyph { flex: none; width: 22px; height: 22px; color: var(--accent); margin-top: 1px; }
      #pictures-ask p { margin: 4px 0 12px; color: var(--muted); }
      .pictures-ask-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .pictures-ask-close {
        position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 6px;
        border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer;
      }
      .pictures-ask-close:hover { background: var(--accent-tint-strong); color: var(--ink); }
      .pictures-ask-close svg { width: 18px; height: 18px; display: block; }
      #empty {
        border-radius: 14px;
        padding: 32px 24px;
        text-align: center;
        color: var(--muted);
        background: var(--card);
        font-size: 14px;
        line-height: 1.6;
      }
      #empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
      #empty .aside { display: block; margin-top: 12px; font-size: 13px; }
      footer { margin-top: 24px; font-size: 14px; }
      .foot-note { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: var(--muted); }
      footer a { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <header class="page-title">
        <img src="icons/tabsend-48.png" alt="" />
        <h1 data-i18n="common.history"></h1>
      </header>
      <p class="desc" data-i18n="history.intro"></p>

      <section id="pictures-ask" class="hidden" aria-labelledby="pictures-ask-title">
        <svg class="pictures-ask-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="m21 15-5-5L5 21"></path>
        </svg>
        <div class="pictures-ask-text">
          <strong id="pictures-ask-title" data-i18n="history.picturesAsk.title"></strong>
          <p data-i18n="history.picturesAsk.body"></p>
          <div class="pictures-ask-actions">
            <button type="button" id="pictures-allow" class="btn-primary" data-i18n="history.picturesAsk.allow"></button>
            <button type="button" id="pictures-later" class="btn-secondary" data-i18n="history.picturesAsk.later"></button>
          </div>
        </div>
        <button type="button" id="pictures-close" class="pictures-ask-close" data-i18n-attrs="aria-label:common.dismiss">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </section>

      <div id="empty" class="hidden">
        <strong data-i18n="history.empty.title"></strong>
        <span data-i18n="history.empty.body"></span>
        <span class="aside" data-i18n="history.empty.aside"></span>
      </div>

      <div id="groups"></div>

      <!-- Direction glyphs, cloned per row. Kept as markup rather than built in
           JS so the icons sit beside the popup's, and so nothing on this page
           ever assembles an element from a string. [ADR-0028 §9] -->
      <template id="glyph-sent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13"></path>
          <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
        </svg>
      </template>
      <template id="glyph-received">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
      </template>
      <template id="glyph-other">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
      </template>

      <footer>
        <p class="foot-note" id="retention"></p>
        <a href="options.html" id="settings-link" data-i18n="history.settingsLink"></a>
      </footer>
    </main>
    <script type="module" src="/src/pages/history.ts"></script>
  </body>
</html>
