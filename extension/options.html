<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options.page.title"></title>
    <link rel="icon" href="icons/tabsend-32.png" />
    <link rel="icon" sizes="16x16" href="icons/tabsend-16.png" />
    <link rel="icon" sizes="48x48" href="icons/tabsend-48.png" />
    <link rel="stylesheet" href="/src/pages/ui.css" />
    <style>
      body {
        display: flex;
        justify-content: center;
        padding: 48px 16px 96px;
      }
      main { width: 100%; max-width: 560px; }
      .setting-control { flex: none; }
      .setting.stack .setting-detail { margin-top: 6px; }
      .one-click { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
      .one-click input {
        flex: none;
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      /* Lines up with the checkbox label's text: 18px box + 12px gap. */
      .indent { margin-left: 30px; }
      #send-to { margin: 4px 0 6px; }
      .relay-line {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin: 0;
      }
      #current-relay { word-break: break-all; font-size: 14px; }
      /* Empty when nothing is known, quiet green when healthy, a waiting-tint
         strip when the relay has gone quiet — this page is where you look when
         sends stop. */
      #relay-status { font-size: 13px; color: var(--success); font-weight: 600; margin: 6px 0 0; }
      #relay-status:empty { display: none; }
      #relay-status.down {
        color: var(--waiting);
        font-weight: 500;
        background: var(--waiting-tint);
        border-radius: 10px;
        padding: 10px 12px;
        line-height: 1.45;
      }
      #move-form label { display: block; font-weight: 600; margin-bottom: 8px; }
      #move-form .input-row { display: flex; gap: 8px; }
      #move-form .input-row input { flex: 1; min-width: 0; }
      #move-hint { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
      /* The verdict: a tinted strip the width of the input above it, so the
         finding and its action read as one result, not a stray line. */
      #probe-result {
        display: none;
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--chip);
      }
      #probe-result.visible { display: block; }
      #probe-result.same { background: var(--success-tint); }
      #probe-result.different { background: var(--waiting-tint); }
      #probe-result.bad { background: var(--danger-tint); }
      .probe-row { display: flex; align-items: flex-start; gap: 10px; }
      #probe-icon { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--muted); }
      #probe-result.same #probe-icon { color: var(--success); }
      #probe-result.different #probe-icon { color: var(--waiting); }
      #probe-result.bad #probe-icon { color: var(--danger); }
      #probe-icon:empty { display: none; }
      #probe-note { margin: 0; font-size: 14px; line-height: 1.5; }
      #probe-actions { margin-top: 10px; margin-left: 28px; }
      #probe-actions:empty { display: none; }
      /* Unfinished move: the same strip, in the accent tint, because it reports
         an incomplete action rather than a good or bad finding. */
      #pending-switch {
        display: none;
        margin: 4px 0 6px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--accent-tint);
      }
      #pending-switch.visible { display: block; }
      #pending-switch svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--accent); }
      #pending-note { margin: 0; font-size: 14px; line-height: 1.5; font-weight: 600; }
      #pending-sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      #pending-actions { margin-top: 10px; margin-left: 28px; }
      #pairing-box { margin-top: 18px; }
      #pairing-unregistered { margin: 0; }
      #devices-block { padding-top: 0; padding-bottom: 0; }
      .device-list li:first-child { border-top: none; }
      #devices-error { display: none; margin: 8px 0 12px; }
      #devices-error.visible { display: block; }
      details { margin-top: 12px; font-size: 13px; color: var(--muted); }
      summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--accent);
        width: max-content;
        border-radius: 4px;
      }
      details p { margin: 8px 0 0; line-height: 1.5; }
      #page-error {
        display: none;
        margin: 0 0 24px;
      }
      #page-error.visible { display: block; }
      /* "Saved ✓" — pinned where it is seen, not at the foot of a long page. */
      .saved {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 14px;
        border: var(--outline);
        border-radius: 999px;
        background: var(--card);
        color: var(--success);
        font-size: 13px;
        font-weight: 700;
      }
      .saved:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <header class="page-title">
        <img src="icons/tabsend-48.png" alt="" />
        <h1 data-i18n="common.settings"></h1>
      </header>

      <div id="page-error" class="notice danger" role="alert"></div>

      <section class="section" aria-labelledby="sec-sending">
        <h2 class="section-label" id="sec-sending" data-i18n="options.sending.heading"></h2>
        <div class="rows">
          <div class="setting stack">
            <label class="one-click">
              <input type="checkbox" id="one-click" />
              <span class="setting-text">
                <span class="setting-title" data-i18n="options.oneClick.title"></span>
                <span class="setting-detail" data-i18n="options.oneClick.detail"></span>
              </span>
            </label>
            <p class="setting-detail indent" id="one-click-off" data-i18n="options.oneClick.off"></p>
            <div class="indent" id="one-click-on" style="display: none">
              <label class="setting-detail" for="send-to" data-i18n="options.oneClick.sendTo"></label>
              <select id="send-to"></select>
              <span class="setting-detail" data-i18n="options.oneClick.undo"></span>
            </div>
          </div>

          <label class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="options.confirmToast.title"></span>
              <span class="setting-detail" data-i18n="options.confirmToast.detail"></span>
            </span>
            <input type="checkbox" class="switch" id="success-toast" />
          </label>

          <label class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="options.pendingRow.title"></span>
              <span class="setting-detail" data-i18n="options.pendingRow.detail"></span>
            </span>
            <input type="checkbox" class="switch" id="pending-row" />
          </label>

          <label class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="options.contextMenus.title"></span>
              <span class="setting-detail" data-i18n="options.contextMenus.detail"></span>
            </span>
            <input type="checkbox" class="switch" id="context-menus" />
          </label>

          <div class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="options.shortcut.title"></span>
              <span class="setting-detail" data-i18n-rich="options.shortcut.detail">
                <code data-i18n-tag="code"></code>
              </span>
            </span>
            <button
              type="button"
              class="linkish setting-control"
              id="open-shortcuts"
              data-i18n="options.shortcut.rebind"
            ></button>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-receiving">
        <h2 class="section-label" id="sec-receiving" data-i18n="options.receiving.heading"></h2>
        <div class="rows">
          <label class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="options.notify.title"></span>
              <span class="setting-detail" data-i18n="options.notify.detail"></span>
            </span>
            <input type="checkbox" class="switch" id="notify-receive" />
          </label>

          <div class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="common.history"></span>
              <span class="setting-detail" data-i18n="options.history.detail"></span>
            </span>
            <button
              type="button"
              id="open-history"
              class="btn-secondary setting-control"
              data-i18n="options.history.open"
            ></button>
          </div>

          <label class="setting">
            <span class="setting-text">
              <span class="setting-title" data-i18n="options.websiteImages.title"></span>
              <span class="setting-detail" data-i18n="options.websiteImages.detail"></span>
            </span>
            <input type="checkbox" class="switch" id="no-website-images" />
          </label>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-devices">
        <h2 class="section-label" id="sec-devices" data-i18n="options.devices.heading"></h2>
        <div class="rows">
          <!-- Every device in the group, with Rename and Remove. The same list as
               the manage screen (device-list.ts); hidden until this browser is paired. -->
          <div class="setting stack" id="devices-block" style="display: none">
            <ul id="device-list" class="device-list"></ul>
            <p class="notice danger" id="devices-error" role="alert"></p>
          </div>
          <div class="setting stack">
            <span class="setting-text">
              <span class="setting-title" data-i18n="common.addDevice"></span>
              <span class="setting-detail" data-i18n="options.pairing.detail"></span>
            </span>
            <p class="setting-detail" id="pairing-unregistered" style="display: none">
              <span data-i18n="options.pairing.unregistered"></span>
              <button
                type="button"
                class="linkish"
                id="pairing-setup-link"
                data-i18n="common.setUpTabsend"
              ></button>
            </p>
            <div>
              <button
                type="button"
                id="pair-device"
                class="btn-primary"
                data-i18n="options.pairing.show"
              ></button>
            </div>
            <div id="pairing-box">
              <div id="pairing-ready">
                <div id="pairing-qr"></div>
                <input
                  id="pairing-link"
                  type="text"
                  readonly
                  data-i18n-attrs="aria-label:pairing.box.linkLabel"
                />
                <div class="pair-actions">
                  <button
                    type="button"
                    class="linkish"
                    id="copy-link"
                    data-i18n="pairing.box.copyLink"
                  ></button>
                  <span id="copy-note"></span>
                </div>
                <p class="pair-hint" data-i18n="pairing.box.hint"></p>
                <div id="pairing-local-only" role="status"></div>
              </div>
              <div id="pairing-note"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- id: the first-run manage screen deep-links here (options.html#connection). -->
      <section class="section" id="connection" aria-labelledby="sec-connection">
        <h2 class="section-label" id="sec-connection" data-i18n="options.connection.heading"></h2>
        <div class="rows">
          <div class="setting stack">
            <p class="relay-line">
              <span class="setting-title" data-i18n="options.relay.label"></span>
              <code id="current-relay">…</code>
            </p>
            <p id="relay-status" role="status"></p>
            <div class="btn-row" id="relay-access-actions"></div>

            <!-- A move to another relay that was started here and not finished.
                 Choosing a different relay no longer unpairs anything, so this state
                 can outlive the tab that began it: it is rebuilt from stored state on
                 every load, and it is the only thing that says the browser is
                 half-way somewhere. Same verdict-strip shape as the probe result. -->
            <div id="pending-switch" role="status">
              <div class="probe-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 8v4l3 2" />
                  <circle cx="12" cy="12" r="9" />
                </svg>
                <div>
                  <p id="pending-note"></p>
                  <p id="pending-sub"></p>
                </div>
              </div>
              <div class="btn-row" id="pending-actions"></div>
            </div>
          </div>

          <!-- One address in, one verdict out. The extension can already tell its
               own relay from a stranger (relayId + an authenticated probe), so it
               classifies instead of asking the user to. -->
          <div id="move-form" class="setting stack">
            <label for="new-address" data-i18n="options.move.label"></label>
            <div class="input-row">
              <input
                type="url"
                id="new-address"
                data-i18n-attrs="placeholder:options.move.addressPlaceholder"
                spellcheck="false"
              />
              <button
                type="button"
                id="relay-check"
                class="btn-secondary"
                data-i18n="options.move.check"
              ></button>
            </div>
            <!-- The same box takes a pairing link, which is how a self-hosted user moves
                 to the hosted service; nothing on this page said so. -->
            <p id="move-hint" data-i18n-rich="options.move.hint">
              <a href="https://tabsend.org/" target="_blank" rel="noopener" data-i18n-tag="link"></a>
            </p>
            <div id="probe-result">
              <div class="probe-row">
                <svg id="probe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
                <p id="probe-note"></p>
              </div>
              <div class="btn-row" id="probe-actions"></div>
            </div>
            <details>
              <summary data-i18n="options.advanced.summary"></summary>
              <p data-i18n-rich="options.advanced.lanAddress">
                <code data-i18n-tag="browser"></code>
                <code data-i18n-tag="app"></code>
              </p>
              <p data-i18n="options.advanced.paste"></p>
            </details>
          </div>
          <p class="setting" id="setup-line" style="display: none">
            <button
              type="button"
              id="change-relay"
              class="btn-secondary"
              data-i18n="common.setUpTabsend"
            ></button>
          </p>
        </div>
      </section>

      <p class="saved" id="saved" role="status"></p>
    </main>

    <dialog id="rename-dialog">
      <h2 data-i18n="common.renameDialog.title"></h2>
      <input id="rename-input" type="text" autocomplete="off" />
      <div class="dialog-actions">
        <button
          type="button"
          id="rename-cancel"
          class="btn-secondary"
          data-i18n="common.cancel"
        ></button>
        <button type="button" id="rename-ok" class="btn-primary" data-i18n="common.ok"></button>
      </div>
    </dialog>
    <script type="module" src="/src/pages/options.ts"></script>
  </body>
</html>
